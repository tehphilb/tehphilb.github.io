<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>photos — icke.dev</title>
    <meta name="description" content="photos — icke.dev" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/ibm-plex-mono-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/": "./vendor/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="phosphor" aria-hidden="true"></div>
    <main class="page page--photos">
      <header class="top">
        <a class="top__mark" href="index.html">
          <span class="top__back" aria-hidden="true">&larr;</span>
          icke.dev
        </a>
        <button
          type="button"
          class="top__dot"
          aria-label="Schwarm einfärben"
          aria-pressed="false"
        ></button>
      </header>

      <section class="photos" aria-label="Photos">
        <p class="label photos__label">
          photos
          <span data-photos-count>00</span>
        </p>
        <label class="proj photos__add" data-photos-add hidden>
          <input
            class="photos__input"
            type="file"
            accept="image/*,image/heic,image/heif"
            multiple
          />
          <span class="proj__name">add photos</span>
          <span class="proj__arrow" aria-hidden="true">+</span>
        </label>
        <p class="photos__status" data-photos-status hidden></p>
        <ul class="photos__grid" data-photos-grid hidden></ul>
        <p class="photos__empty" data-photos-empty>noch keine fotos.</p>
      </section>

      <footer class="foot">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <button type="button" class="photos__lock" data-photos-lock hidden>
          lock
        </button>
      </footer>
    </main>

    <dialog class="photos__view" aria-label="Foto">
      <img alt="" />
      <div class="photos__view-bar">
        <button type="button" data-close>close</button>
        <button type="button" data-delete hidden>delete</button>
      </div>
    </dialog>

    <script src="photos.js"></script>
    <script type="module" src="phosphor.js"></script>
    <script type="module" src="ocean.js"></script>
    <script type="module" src="noise.js"></script>
    <script type="module" src="milkyway.js"></script>
  </body>
</html>
