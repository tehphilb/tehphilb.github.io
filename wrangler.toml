# Cloudflare Worker + R2 for the photos album.
# Dashboard: https://dash.cloudflare.com
#
# 1. R2 → Create bucket  name: icke-photos  location: European Union
# 2. npx wrangler secret put UPLOAD_TOKEN
# 3. npx wrangler deploy
# 4. Paste the workers.dev URL into site.json → photosApi

name = "icke-photos"
main = "worker/index.js"
compatibility_date = "2026-09-03"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://icke.dev,https://www.icke.dev,https://tehphilb.github.io,http://127.0.0.1:4321,http://localhost:4321"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "icke-photos"
jurisdiction = "eu"
