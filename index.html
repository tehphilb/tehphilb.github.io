<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>icke.dev</title>
    <meta name="description" content="icke.dev — kontakt: info@icke.dev" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/ibm-plex-mono-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/": "./vendor/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="phosphor" aria-hidden="true"></div>
    <main class="page">
      <header class="top">
        <span class="top__mark">icke.dev</span>
        <button
          type="button"
          class="top__dot"
          aria-label="Schwarm einfärben"
          aria-pressed="false"
        ></button>
      </header>

      <section class="hero">
        <p class="label">mail</p>
        <h1 class="hero__mail">
          <a data-site-mailto="email" href="mailto:info@icke.dev"
            >info@icke.dev</a
          ><span class="caret" aria-hidden="true"></span>
        </h1>
      </section>

      <section class="work" aria-label="Projects">
        <div class="work__fold">
          <button
            type="button"
            class="proj work__sum"
            aria-expanded="false"
            aria-controls="project-list"
          >
            <span class="proj__name">projects</span>
            <span class="proj__meta">02</span>
            <span class="work__toggle" aria-hidden="true"></span>
          </button>
          <div class="work__list" id="project-list">
            <div class="work__list-inner">
              <a
                class="proj"
                href="https://www.entwicklungsraum-fussball.de"
                target="_blank"
                rel="noreferrer"
              >
                <span class="proj__name">entwicklungsraum-fussball</span>
                <span class="proj__meta">website — html, js</span>
                <span class="proj__arrow" aria-hidden="true">&nearr;</span>
              </a>
              <a
                class="proj"
                href="https://turnierradar.de"
                target="_blank"
                rel="noreferrer"
              >
                <span class="proj__name">turnierradar</span>
                <span class="proj__meta">app — contributed, flutter, ios / android</span>
                <span class="proj__arrow" aria-hidden="true">&nearr;</span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <footer class="foot">
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </footer>
    </main>
    <script src="legal.js"></script>
    <script type="module" src="phosphor.js"></script>
    <script type="module" src="ocean.js"></script>
    <script type="module" src="noise.js"></script>
    <script type="module" src="milkyway.js"></script>
  </body>
</html>
